# Ao publicar uma release (pelo site do GitHub ou pelo gh), monta o zip do módulo
# e anexa o zip e o module.json à release. O Foundry/Forge instala e atualiza por:
#   https://github.com/Yamavaki/Nauren-Modulo-Foundry-Discord/releases/latest/download/module.json
name: Release do módulo
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  anexar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name }}
      - name: Conferir versão da release com o module.json
        run: |
          TAG="${{ github.event.release.tag_name }}"; TAG="${TAG#v}"
          VER=$(jq -r .version module.json)
          if [ "$TAG" != "$VER" ]; then echo "A release ($TAG) não bate com a versão do module.json ($VER)"; exit 1; fi
      - name: Montar e anexar o zip
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip -r nauren-discord.zip module.json scripts
          gh release upload "${{ github.event.release.tag_name }}" nauren-discord.zip module.json --clobber
